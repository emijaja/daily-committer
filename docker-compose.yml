services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: confidently
      POSTGRES_PASSWORD: confidently
      POSTGRES_DB: confidently
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U confidently"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  db-data:
