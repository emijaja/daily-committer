name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: confidently
          POSTGRES_PASSWORD: confidently
          POSTGRES_DB: confidently
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U confidently"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://confidently:confidently@localhost:5432/confidently
      BETTER_AUTH_SECRET: ci-only-secret-not-used-in-production-000000
      BETTER_AUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-dummy-client-id
      GOOGLE_CLIENT_SECRET: ci-dummy-client-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migrate
        run: pnpm db:migrate
      - name: Integration tests
        run: pnpm run --if-present test:integration
      - run: pnpm build
